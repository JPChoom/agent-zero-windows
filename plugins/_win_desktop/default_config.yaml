# Screen capture (read-only) - safe to leave on.
capture_enabled: true

# Longest edge, in pixels, that a captured frame is scaled down to before
# encoding. Full 1920x1080 frames cost ~50ms to resize and are rarely
# needed for the model to read a screen; smaller is faster and cheaper in
# context tokens. 0 disables scaling (send native resolution).
capture_max_edge: 1280

# JPEG quality for captured frames (1-95).
capture_jpeg_quality: 60

# INPUT CONTROL - deliberately off by default.
#
# An agent that can move the mouse and press keys can do anything the
# signed-in user can, including actions the _safety_policy plugin cannot
# see: it inspects terminal command text, and synthetic clicks/keystrokes
# never pass through it. A misled agent could dismiss a UAC prompt, drive
# a browser, or operate any open application. Enable only deliberately.
#
# When enabled, input is still refused while the kill switch is tripped
# (helpers/kill_switch.py) and every action is written to the audit log.
control_enabled: false
