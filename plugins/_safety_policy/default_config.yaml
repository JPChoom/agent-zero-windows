# Master switch. When false, no commands are blocked by this plugin.
# Enabled by default: unlike the coding controller's completion gate, this
# only ever intervenes on commands no legitimate coding workflow needs.
enforce_policy: true

# Extra deny patterns beyond the built-in categories (one regex per line,
# case-insensitive). Use this to tighten the policy further. Custom
# patterns always hard-deny - the approval tier below only applies to the
# built-in categories.
custom_deny_patterns: ""

# Per-category tier: "deny" (blocked outright) or "approve" (blocked until
# the user clicks Approve in the chat, see approval_timeout_seconds).
# Categories with no realistic legitimate use in a coding workflow default
# to a hard deny; more context-dependent ones default to approve-required.
tier_downloader: "deny"
tier_persistence: "deny"
tier_credential_access: "deny"
tier_obfuscation: "deny"
tier_destructive_delete: "deny"
tier_disk_and_reboot: "deny"
tier_firewall_and_defender: "approve"
tier_privilege_escalation: "approve"
tier_account_changes: "approve"

# How long an approve-tier command waits for a human Approve/Deny click
# before it's treated as denied.
approval_timeout_seconds: 300

# Advisory network-destination allowlist: when enabled, a "downloader"
# command (curl/wget/Invoke-WebRequest/etc.) whose URL host matches an
# entry below (or a subdomain of one) is allowed outright, skipping
# tier_downloader entirely. Off by default - the host is extracted from
# the literal command text (not real network enforcement) and this
# changes existing behavior for a category that's hard-denied by
# default, so it's opt-in rather than silently loosening it. See
# README.md.
enable_network_destination_allowlist: false
network_destination_allowlist:
  - "nuget.org"
  - "npmjs.org"
  - "pypi.org"
  - "github.com"
  - "localhost"
  - "127.0.0.1"
