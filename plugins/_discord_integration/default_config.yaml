bots: []
# Example bot:
# - name: my_bot
#   enabled: true
#   token: ""                 # Bot token from the Discord Developer Portal (Bot > Reset Token)
#   allowed_users: []         # Discord user IDs (or unique usernames, never display names) allowed to talk to the agent.
#   agent_profile: ""      # Agent profile for new chats from this bot (empty = default).
#   allow_switching: false  # /agent and /project may change a profile or project set here.
#                             # EMPTY = NOBODY. Ignored senders are logged with their id.
#   server_mode: mention      # mention (answer when @mentioned) | all (every message; needs the
#                             # Message Content intent enabled in the portal) | off (DMs only)
#   allowed_channels: []      # Server channel IDs the bot may answer in. Empty = any channel.
#   user_projects: {}         # Map Discord user id to a project name
#   default_project: ""
#   notify_messages: false    # WebUI notification for each incoming message
#   agent_instructions: ""    # Extra instructions for the agent in Discord chats
#
# Chats from Discord run at most in the permission mode set in
# Settings > Security > _permissions channel_mode_caps.discord (default manual);
# approvals appear in the WebUI.
