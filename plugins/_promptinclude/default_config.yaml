# Includes are read only from usr/promptincludes/ and the active project's
# root folder, top level only (see extensions/python/system_prompt/
# _16_promptinclude.py) - there is no recursive search depth to configure.
name_pattern: "*.promptinclude.md"
max_file_tokens: 2000
max_file_count: 50
max_total_tokens: 8000
gitignore: |
  venv/**
  **/__pycache__/**
  **/node_modules/**
  **/.npm/**
  **/.git/**
  **/.conda/**
  **/.cache/**
  **/dist/**
  **/build/**
  **/.tox/**
  **/.eggs/**
  **/*.egg-info/**
