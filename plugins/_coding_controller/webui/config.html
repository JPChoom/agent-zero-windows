<html>
<head>
    <title>Coding Controller</title>
</head>

<body>
    <div x-data>
        <template x-if="config">
            <div>
                <div class="section-title">Coding Controller</div>
                <div class="section-description">
                    Runs lint/build/test quality gates after code edits and blocks a false "done" response until they pass, with a bounded automatic repair loop. The gate stays off until you enable it below for this project/agent scope.
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enforce completion gate</div>
                        <div class="field-description">
                            When on, the agent cannot finish a turn that touched a detected project (.NET, npm, or PowerShell) until its gate commands pass, or the repair attempt budget below is exhausted.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="checkbox" x-model="config.enforce_completion_gate" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Max repair attempts</div>
                        <div class="field-description">Automatic repair attempts allowed per project before giving up and reporting the failure.</div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="0" x-model.number="config.max_repair_attempts" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Command timeout (seconds)</div>
                        <div class="field-description">Hard cap on any single gate command (restore/build/test/lint).</div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="1" x-model.number="config.command_timeout_seconds" />
                    </div>
                </div>

                <div class="section-title">.NET (dotnet)</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Restore before build</div>
                    </div>
                    <div class="field-control">
                        <input type="checkbox" x-model="config.dotnet_restore_first" />
                    </div>
                </div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Build arguments</div>
                        <div class="field-description">Appended after "dotnet". The detected .sln/.csproj is appended automatically.</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.dotnet_build_args" />
                    </div>
                </div>

                <div class="section-title">npm</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Install before test</div>
                    </div>
                    <div class="field-control">
                        <input type="checkbox" x-model="config.npm_install_first" />
                    </div>
                </div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Test arguments</div>
                        <div class="field-description">Appended after "npm".</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.npm_test_args" />
                    </div>
                </div>

                <div class="section-title">PowerShell</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable PSScriptAnalyzer lint</div>
                        <div class="field-description">Skipped automatically if PSScriptAnalyzer is not installed.</div>
                    </div>
                    <div class="field-control">
                        <input type="checkbox" x-model="config.powershell_lint_enabled" />
                    </div>
                </div>

                <div class="section-title">Python</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">pytest arguments</div>
                        <div class="field-description">Appended after "pytest". ruff check/format run automatically if ruff is installed; gate is skipped only if neither ruff nor pytest is found.</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.python_test_args" />
                    </div>
                </div>

                <div class="section-title">Go</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">go test arguments</div>
                        <div class="field-description">Appended after "go test". gofmt/go vet/go build run automatically.</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.go_test_args" />
                    </div>
                </div>

                <div class="section-title">Rust</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">cargo build arguments</div>
                        <div class="field-description">Appended after "cargo". cargo fmt --check/clippy/test run automatically.</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.rust_build_args" />
                    </div>
                </div>

                <div class="section-title">Java / Kotlin</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Maven test arguments</div>
                        <div class="field-description">Appended after "mvn" (or the project's own mvnw) when pom.xml is found.</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.java_maven_test_args" />
                    </div>
                </div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Gradle test arguments</div>
                        <div class="field-description">Appended after "gradle" (or the project's own gradlew) when build.gradle(.kts) is found.</div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.java_gradle_test_args" />
                    </div>
                </div>

                <div class="section-title">C / C++</div>
                <div class="section-description">
                    CMake configure + build, ctest if configured. clang-format/clang-tidy run automatically only if found on PATH. No tunable arguments here - commands are structural (build directory, compile commands database) rather than a single argument string.
                </div>
            </div>
        </template>
    </div>
</body>

</html>
