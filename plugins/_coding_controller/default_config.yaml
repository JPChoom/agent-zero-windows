# Master switch. When false, the automatic completion gate never blocks a
# response - the manual "coding_gate" tool still works for on-demand checks.
# Enable per project once you've confirmed the commands below work there.
enforce_completion_gate: false

# Maximum automatic repair attempts per project before giving up and
# reporting the failure instead of blocking forever.
max_repair_attempts: 3

# Hard timeout (seconds) for any single gate command.
command_timeout_seconds: 300

# .NET (dotnet CLI) adapter
dotnet_restore_first: true
dotnet_build_args: "build --no-restore -nologo"

# npm adapter
npm_install_first: false
npm_test_args: "test"

# PowerShell adapter (PSScriptAnalyzer lint only; skipped if not installed)
powershell_lint_enabled: true

# Independent diff review: once the full gate passes cleanly, spawn a
# fresh, read-only "coding-reviewer" sub-agent to inspect the diff before
# letting the response through. Off by default like the completion gate
# itself - enable per project once verified. A spawn/parse failure never
# blocks completion (treated as UNABLE_TO_VERIFY, logged, not blocking).
enable_independent_review: false

# NOTE: not yet enforced as a deterministic threshold - the reviewer's own
# per-finding "blocking" flag is what currently gates completion. This
# field is reserved for a follow-up that makes severity >= this value the
# actual (deterministic) blocking rule instead. See reviewer.py.
review_blocking_severity: "high"

# Python adapter (ruff lint+format if installed, pytest if installed;
# skipped entirely only if neither is found)
python_test_args: ""

# Go adapter (gofmt -l, go vet, go build, go test)
go_test_args: "./..."

# Rust adapter (cargo fmt --check, cargo clippy, cargo build, cargo test)
rust_build_args: "build"

# Java/Kotlin adapter (Maven or Gradle, whichever marker is found; prefers
# the project's own mvnw/gradlew wrapper over a global install)
java_maven_test_args: "test"
java_gradle_test_args: "test"

# C/C++ adapter (CMake configure+build, ctest if configured, clang-format/
# clang-tidy only if found on PATH) has no per-project args here - its
# commands are structural (build directory, compile commands database)
# rather than a single tunable argument string.

# Root-cause diagnosis: once the automatic repair loop gives up on a
# project (exhausted max_repair_attempts without clearing a new failure),
# spawn a fresh, read-only "coding-diagnostician" sub-agent to explain the
# likely root cause as an advisory note. Purely informational - it cannot
# fix anything and never re-blocks completion. Off by default like the
# other independent sub-agent features.
enable_diagnostician: false
