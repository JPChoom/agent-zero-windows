<html>
<head>
  <title>Permission Mode Selector</title>
  <script type="module" src="/plugins/_permissions/webui/mode-store.js"></script>
</head>
<body>
  <div x-data class="permissions-mode-wrap">
    <template x-if="$store.permissionsMode">
      <!-- The root is the flex item in .text-buttons-row
           (bottom-actions-bar.html) and the positioning anchor for the
           menu, so the menu opens above this button, not the row's start. -->
      <div class="permissions-mode-root" x-every-second="$store.permissionsMode.sync()">
        <button
          class="text-button"
          :class="{ 'permissions-mode-bypass': $store.permissionsMode.mode === 'bypass' }"
          @click="$store.permissionsMode.open = !$store.permissionsMode.open"
          title="How much Agent Zero checks with you before acting (this chat)"
        >
          <span class="permissions-mode-dot" :style="{ backgroundColor: $store.permissionsMode.color() }"></span>
          <span x-text="$store.permissionsMode.label()"></span>
          <span class="permissions-mode-remaining"
                x-show="$store.permissionsMode.bypassRemaining()"
                x-text="'(' + $store.permissionsMode.bypassRemaining() + ')'"></span>
        </button>

        <div
          x-show="$store.permissionsMode.open"
          @click.outside="$store.permissionsMode.open = false"
          x-keep-in-view
          x-transition
          class="permissions-mode-menu"
        >
          <template x-for="m in $store.permissionsMode.modes" :key="m.id">
            <button
              type="button"
              class="permissions-mode-option"
              :class="{ 'is-active': m.id === $store.permissionsMode.mode }"
              @click="$store.permissionsMode.select(m.id)"
            >
              <span class="permissions-mode-option-head">
                <span class="permissions-mode-dot" :style="{ backgroundColor: m.color }"></span>
                <span class="permissions-mode-option-label" x-text="m.label"></span>
                <span class="permissions-mode-option-check" x-show="m.id === $store.permissionsMode.mode" aria-hidden="true">&check;</span>
              </span>
              <span class="permissions-mode-option-desc" x-text="m.description"></span>
            </button>
          </template>
        </div>
      </div>
    </template>
  </div>

  <style>
    .permissions-mode-wrap {
      position: relative;
    }

    .permissions-mode-root {
      position: relative;
      display: flex;
      align-items: center;
    }

    .text-button.permissions-mode-bypass {
      color: #ef4444;
      font-weight: 600;
    }

    .permissions-mode-remaining {
      opacity: 0.8;
      font-size: 0.85em;
    }

    .permissions-mode-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .permissions-mode-menu {
      position: absolute;
      bottom: 100%;
      left: 0;
      z-index: 60;
      min-width: 240px;
      margin-bottom: 0.35rem;
      padding: 0.35rem;
      border-radius: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .permissions-mode-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.4rem 0.5rem;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      border-radius: 0.35rem;
      font-family: inherit;
    }

    .permissions-mode-option:hover {
      background: var(--color-background-hover);
    }

    .permissions-mode-option.is-active {
      background: color-mix(in srgb, var(--color-highlight) 14%, transparent);
    }

    .permissions-mode-option-head {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .permissions-mode-option-label {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .permissions-mode-option-check {
      color: var(--color-highlight);
      font-weight: 700;
    }

    .permissions-mode-option-desc {
      display: block;
      margin-left: calc(8px + 0.4rem);
      opacity: 0.7;
      font-size: 0.72rem;
    }
  </style>
</body>
</html>
