# The permission *mode* is not configured here. It is chosen per chat from
# the selector under the chat box, held in memory only, and every chat
# starts at Settings > Security > "Default permission mode" (default:
# manual) - after a restart, in a new chat, or after switching project.
# Bypass needs its own password and turns itself off after the configured
# number of hours. See helpers/mode_state.py and helpers/bypass_lock.py.
#
#   plan          refuses state changes outright, so a plan comes first
#   manual        asks before anything that changes state
#   accept_edits  file edits proceed; anything that executes still asks
#   auto          works freely; rules and the safety policy still apply
#   bypass        stops asking entirely (password required)

# Rules are matched before the mode is consulted, in the order
# deny > ask > allow - so a specific prohibition is never overridden by a
# broader permission, whichever order they appear in.
#
# Write them as `tool_name` (the whole tool) or `tool_name(pattern)`,
# where the pattern is a case-insensitive glob matched against the call's
# identifying argument: the command for code_execution_tool, action:path
# for text_editor, action:url for ytdlp, and so on.
#
#   code_execution_tool(git status*)
#   text_editor(read:*)
#   desktop_control
#
# One rule per line.

# Never run these, whatever the mode. Deny rules bind even in bypass.
deny: ""

# Always check with the user first.
ask: ""

# Run without asking, even in manual mode.
allow: ""

# How long an approval prompt waits for an answer before being treated as
# denied. Matches the safety policy's own timeout.
approval_timeout_seconds: 300

# Highest permission mode a chat that arrived over a messaging channel may
# run in, whatever the chat's selector says. One of plan, manual,
# accept_edits, auto (bypass is never allowed here). Approvals for "ask"
# decisions appear in the WebUI chat.
channel_mode_caps:
  telegram: manual
  whatsapp: manual
  email: manual
  discord: manual
  slack: manual

# Write every ask/deny decision to the audit log. Allowed calls are not
# logged: in auto mode that would be nearly every tool call.
audit_decisions: true
