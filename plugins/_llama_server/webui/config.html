<html>
<head><title>llama.cpp server</title></head>
<body>
<div x-data="{
    info: null, busy: false, error: '', plan: null,
    async call(action, extra = {}) {
      this.busy = true; this.error = '';
      try {
        const api = await import('/js/api.js');
        const r = await api.callJsonApi('/plugins/_llama_server/llama_server', { action, ...extra });
        this.info = r;
        if (!r.ok) this.error = r.error || 'Failed';
        if (r.plan) this.plan = r.plan;
      } catch (e) { this.error = e?.message || 'Failed'; }
      finally { this.busy = false; }
    },
    stateLabel() {
      const s = this.info?.status?.state;
      return { running: 'Running', starting: 'Starting (loading the model)...', failed: 'Failed', stopped: 'Stopped' }[s] || 'Checking...';
    },
    mb(n) { return n >= 1024 ? (n / 1024).toFixed(1) + ' GB' : n + ' MB'; }
  }" x-init="call('status')">
  <template x-if="config">
    <div>
      <div class="section-title">llama.cpp server</div>
      <div class="section-description">
        Agent Zero starts, watches and stops its own <code>llama-server.exe</code>, so you do not need LM Studio running.
        It listens on this PC only (127.0.0.1). To use it, pick the <b>llama.cpp</b> provider in Settings &gt; Agent
        &gt; Models (default address <code>http://127.0.0.1:8090/v1</code>). LM Studio and other providers keep working.
        Save your changes below before starting the server.
      </div>

      <div class="field">
        <div class="field-label">
          <div class="field-title">Server</div>
          <div class="field-description">
            <span x-text="stateLabel()"></span>
            <template x-if="info && info.status && info.status.state === 'running'">
              <span> - <code x-text="info.status.alias"></code> at <code x-text="info.status.api_base"></code><span x-show="info.status.adopted"> (kept from before a restart)</span></span>
            </template>
            <div x-show="info && info.status && info.status.last_error" style="color: var(--color-error, #c33)" x-text="info?.status?.last_error"></div>
            <div x-show="error" style="color: var(--color-error, #c33)" x-text="error"></div>
            <div x-show="info" class="field-description">Log: <code x-text="info?.status?.log"></code></div>
          </div>
        </div>
        <div class="field-control" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-field" :disabled="busy" x-show="!info || !['running','starting'].includes(info.status.state)" @click="call('start')">Start</button>
          <button class="btn btn-field" :disabled="busy" x-show="info && ['running','starting'].includes(info.status.state)" @click="call('restart')">Restart</button>
          <button class="btn btn-field" :disabled="busy" x-show="info && ['running','starting'].includes(info.status.state)" @click="call('stop')">Stop</button>
          <button class="btn btn-field" :disabled="busy" @click="call('status')">Refresh</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <div class="field-title">Start with Agent Zero</div>
          <div class="field-description">Start the server automatically when Agent Zero starts. It is stopped when Agent Zero exits.</div>
        </div>
        <div class="field-control">
          <label class="toggle"><input type="checkbox" x-model="config.autostart" /><span class="toggler"></span></label>
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <div class="field-title">Model (GGUF)</div>
          <div class="field-description">
            Models are not included: download a <code>.gguf</code> file (Q4_K_M is a good balance of speed and quality)
            into <code x-text="info?.models_dir || 'usr/llama-cpp/models'"></code>, or enter any path.
          </div>
        </div>
        <div class="field-control" style="display:flex;flex-direction:column;gap:6px">
          <template x-if="info && info.models && info.models.length">
            <select @change="config.model_path = $event.target.value">
              <option value="">Choose a model in the models folder...</option>
              <template x-for="m in info.models" :key="m.path">
                <option :value="m.path" :selected="m.path === config.model_path" x-text="m.name + ' (' + mb(m.size_mb) + ')'"></option>
              </template>
            </select>
          </template>
          <input type="text" x-model="config.model_path" placeholder="C:\path\to\model.gguf" />
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <div class="field-title">llama-server.exe</div>
          <div class="field-description">
            <span x-show="info && info.binary_exists">Found<span x-show="info && info.installed"> (release <code x-text="info?.installed?.tag"></code>, <span x-text="info?.installed?.variant"></span>)</span>.</span>
            <span x-show="info && !info.binary_exists">Not found yet.</span>
            Download fetches the latest official build from github.com/ggml-org/llama.cpp (MIT license) and installs it only
            if its SHA-256 matches the one GitHub publishes. Leave the path empty to use the downloaded one.
          </div>
        </div>
        <div class="field-control" style="display:flex;flex-direction:column;gap:6px">
          <input type="text" x-model="config.binary_path" placeholder="usr/llama-cpp/bin/llama-server.exe" />
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select x-model="config.download_variant">
              <option value="" x-text="'Build: automatic (' + (info?.suggested_variant || 'cpu') + ')'"></option>
              <option value="cuda">Build: NVIDIA (CUDA)</option>
              <option value="vulkan">Build: Vulkan (AMD / Intel / NVIDIA)</option>
              <option value="rocm">Build: AMD ROCm (needs AMD's HIP runtime)</option>
              <option value="cpu">Build: CPU only</option>
            </select>
            <button class="btn btn-field" :disabled="busy" @click="call('download_plan', { variant: config.download_variant })">Check download</button>
            <button class="btn btn-field" :disabled="busy || !plan" @click="call('download', { variant: config.download_variant })">Download and install</button>
          </div>
          <template x-if="plan">
            <div class="field-description">
              Release <code x-text="plan.tag"></code>:
              <template x-for="a in plan.assets" :key="a.name"><div><code x-text="a.name"></code> (<span x-text="mb(Math.round(a.size / 1048576))"></span>)</div></template>
            </div>
          </template>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><div class="field-title">Port</div><div class="field-description">On 127.0.0.1. Keep the llama.cpp provider address in sync.</div></div>
        <div class="field-control"><input type="number" min="1024" max="65535" x-model.number="config.port" /></div>
      </div>
      <div class="field">
        <div class="field-label"><div class="field-title">Context size</div><div class="field-description">Tokens (-c). Larger uses more memory.</div></div>
        <div class="field-control"><input type="number" min="512" step="512" x-model.number="config.context_size" /></div>
      </div>
      <div class="field">
        <div class="field-label"><div class="field-title">GPU layers</div><div class="field-description">-ngl. 99 = as many as possible, 0 = CPU only.</div></div>
        <div class="field-control"><input type="number" min="0" x-model.number="config.gpu_layers" /></div>
      </div>
      <div class="field">
        <div class="field-label"><div class="field-title">CPU threads</div><div class="field-description">0 = automatic.</div></div>
        <div class="field-control"><input type="number" min="0" x-model.number="config.threads" /></div>
      </div>
      <div class="field">
        <div class="field-label"><div class="field-title">Check free GPU memory</div><div class="field-description">Refuse to start when an NVIDIA GPU clearly lacks memory for the model (uses nvidia-smi).</div></div>
        <div class="field-control"><label class="toggle"><input type="checkbox" x-model="config.vram_check" /><span class="toggler"></span></label></div>
      </div>
      <div class="field">
        <div class="field-label"><div class="field-title">Extra arguments</div><div class="field-description">Passed to llama-server, e.g. <code>--flash-attn on</code>. Host, port, model and alias cannot be changed here.</div></div>
        <div class="field-control"><input type="text" x-model="config.extra_args" /></div>
      </div>
    </div>
  </template>
</div>
</body>
</html>
