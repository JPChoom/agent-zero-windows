<html>
<head>
  <script type="module">
    import { store } from "/plugins/_perf/webui/speed-counter-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.speedCounter">
      <li>
        <span class="switch-label">Speed counter</span>
        <label class="switch">
          <input type="checkbox" :checked="$store.speedCounter.enabled"
                 @change="$store.speedCounter.setEnabled($event.target.checked)">
          <span class="slider"></span>
        </label>
      </li>
    </template>
  </div>
</body>
</html>
