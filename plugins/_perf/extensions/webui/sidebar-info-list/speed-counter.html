<html>
<head>
  <script type="module">
    import { store } from "/plugins/_perf/webui/speed-counter-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.speedCounter">
      <div class="speed-counter"
           :class="{ 'speed-counter-active': $store.speedCounter.active }"
           x-create="$store.speedCounter.onMount()"
           x-destroy="$store.speedCounter.cleanup()">
        <button type="button" class="speed-counter-main"
                title="Generation speed (estimated from the streamed text)"
                :aria-expanded="$store.speedCounter.expanded"
                @click="$store.speedCounter.expanded = !$store.speedCounter.expanded">
          <span class="material-symbols-outlined" aria-hidden="true">speed</span>
          <span class="speed-counter-value" x-text="$store.speedCounter.label"></span>
          <span class="speed-counter-phase" x-show="$store.speedCounter.phase !== 'reading'" x-text="$store.speedCounter.phaseLabel"></span>
          <span class="material-symbols-outlined speed-counter-arrow" aria-hidden="true"
                x-text="$store.speedCounter.expanded ? 'expand_less' : 'expand_more'"></span>
        </button>
        <div class="speed-graph" role="img" aria-label="Tokens per second over the last 60 seconds">
          <svg viewBox="0 0 120 40" preserveAspectRatio="none" aria-hidden="true">
            <polygon class="speed-graph-area" :points="$store.speedCounter.graphArea"></polygon>
            <polyline class="speed-graph-line" :points="$store.speedCounter.graphLine"></polyline>
          </svg>
          <div class="speed-graph-scale">
            <span>60 s</span>
            <span x-text="$store.speedCounter.graphTop + ' tok/s'"></span>
          </div>
        </div>
        <template x-if="$store.speedCounter.expanded">
          <dl class="speed-counter-details">
            <template x-for="[name, value] in $store.speedCounter.rows" :key="name">
              <div>
                <dt x-text="name"></dt>
                <dd x-text="value"></dd>
              </div>
            </template>
            <div x-show="!$store.speedCounter.rows.length"><dt>No answers measured yet</dt></div>
          </dl>
        </template>
      </div>
    </template>
  </div>

  <style>
    .speed-counter {
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }

    .speed-counter-main {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 4px 6px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      opacity: 0.65;
    }

    .speed-counter-main:hover,
    .speed-counter-active .speed-counter-main {
      opacity: 1;
    }

    .speed-counter-main .material-symbols-outlined {
      flex: none;
      font-size: 16px;
    }

    .speed-counter-value {
      flex: none;
      color: var(--color-text);
      font-variant-numeric: tabular-nums;
    }

    .speed-counter-phase {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .speed-counter-arrow {
      margin-left: auto;
    }

    .speed-graph {
      padding: 2px 6px 0;
    }

    .speed-graph svg {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 44px;
      border: 1px solid var(--color-border, rgba(127, 127, 127, 0.35));
      /* Task Manager's grid: 10 columns, 4 rows */
      background-image:
        linear-gradient(to right, rgba(127, 127, 127, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(127, 127, 127, 0.14) 1px, transparent 1px);
      background-size: 10% 100%, 100% 25%;
    }

    .speed-graph-area {
      fill: var(--accent, #4a8cff);
      fill-opacity: 0.2;
      stroke: none;
    }

    .speed-graph-line {
      fill: none;
      stroke: var(--accent, #4a8cff);
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
    }

    .speed-graph-scale {
      display: flex;
      justify-content: space-between;
      padding-top: 1px;
      font-size: 0.65rem;
      font-variant-numeric: tabular-nums;
      opacity: 0.7;
    }

    .speed-counter-details {
      margin: 2px 0 0;
      padding: 0 6px 4px 28px;
    }

    .speed-counter-details > div {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .speed-counter-details dt {
      flex: none;
      font-weight: normal;
    }

    .speed-counter-details dd {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--color-text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</body>
</html>
