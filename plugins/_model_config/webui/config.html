<html>
<head>
  <title>Model Configuration</title>
  <script type="module">
    import { store } from "/plugins/_model_config/webui/model-config-store.js";
  </script>
</head>

<body>
  <div x-data
       x-init="
         await $store.modelConfig.ensureLoaded();
         $store.modelConfig.resetApiKeyDrafts();
         await $store.modelConfig.refreshApiKeyStatus();
         $store.modelConfig.installSettingsHooks(context);
       ">
    <template x-if="config && $store.modelConfig._loaded">
      <div class="model-config-sections">

        <!-- Model Sections (Main, Utility, Embedding) -->
        <template x-for="section in $store.modelConfig.MODEL_SECTIONS" :key="section.key">
          <div class="model-section"
               x-data="{ get model() { return config[section.key]; }, modelType: section.key.replace('_model', ''), providers: $store.modelConfig.getProviders(section.key), searchType: $store.modelConfig.getSearchType(section.key), apiKeyMode: 'store' }">
            <div class="section-title" x-text="section.title"></div>
            <div class="section-description" x-text="section.desc"></div>
            <x-component path="/plugins/_model_config/webui/model-field.html"></x-component>
          </div>
        </template>

        <!-- Local model server (llama.cpp): picking a model wires Main/Utility to it -->
        <x-component path="/plugins/_model_config/webui/local-server.html"></x-component>


        <!-- Single model -->
        <div class="model-section">
          <div class="section-title">Single model</div>
          <div class="section-description">Use the Main model for everything: the Utility model setting is ignored and there is no separate vision model (the Main model's own vision setting decides). Embeddings stay separate. Handy with one local model (LM Studio or the llama.cpp server).</div>
          <div class="field">
            <div class="field-label">
              <div class="field-title">Use the Main model for all slots</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="config.single_model_mode" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>
        </div>

        <!-- Thinking budget -->
        <div class="model-section">
          <div class="section-title">Thinking</div>
          <div class="section-description">How much the Main model thinks before it answers. Thinking is often most of a step's time on a local GPU. Applied on llama.cpp and LM Studio; other providers are not changed.</div>
          <div class="field">
            <div class="field-label">
              <div class="field-title">Thinking</div>
              <div class="field-description" x-text="{
                on: 'The model decides, as before.',
                off: 'Never think: fastest, but weaker on hard problems.',
                auto: 'Think on the first step of a turn and after a step that failed or was refused; skip it on routine steps in between.'
              }[config.thinking || 'on']"></div>
            </div>
            <div class="field-control">
              <select x-init="config.thinking = config.thinking || 'on'" :value="config.thinking"
                      @change="if ($event.target.value === 'auto' && !confirm('Experimental feature.\n\nAuto thinking skips the model\'s thinking on routine steps (after a tool result) and keeps it for planning and after errors. It is faster but can make the agent miss things on hard tasks.\n\nTurn it on?')) { $event.target.value = config.thinking; } else { config.thinking = $event.target.value; }">
                <option value="on">On (default)</option>
                <option value="auto">Auto (Experimental)</option>
                <option value="off">Off</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Sampling -->
        <template x-if="config.sampling">
        <div class="model-section">
          <div class="section-title">Sampling</div>
          <div class="section-description">For the Main and Utility models. Leave a value empty to use the provider's default. Values set in a model's own extra parameters win. Top K and repeat penalty only reach local servers (llama.cpp, LM Studio, Ollama, vLLM).</div>
          <template x-for="item in [
              { key: 'temperature', title: 'Temperature', hint: 'Lower = more focused, higher = more varied (0-2).', step: '0.05' },
              { key: 'top_p', title: 'Top P', hint: 'Nucleus sampling (0-1).', step: '0.01' },
              { key: 'top_k', title: 'Top K', hint: 'Consider only the K most likely tokens.', step: '1' },
              { key: 'repeat_penalty', title: 'Repeat penalty', hint: 'Above 1 discourages repetition.', step: '0.05' }
            ]" :key="item.key">
            <div class="field">
              <div class="field-label">
                <div class="field-title" x-text="item.title"></div>
                <div class="field-description" x-text="item.hint"></div>
              </div>
              <div class="field-control" style="display:flex;gap:10px;align-items:center">
                <input type="number" min="0" :step="item.step" placeholder="default" x-model="config.sampling[item.key]" style="max-width:120px" />
                <label class="sampling-lock" :title="'Lock: the experimental dynamic adjustment never changes this value'">
                  <input type="checkbox" x-init="config.sampling.locks = config.sampling.locks || {}" x-model="config.sampling.locks[item.key]" />
                  <span>Lock</span>
                </label>
              </div>
            </div>
          </template>
          <div class="field">
            <div class="field-label">
              <div class="field-title">Dynamic adjustment <span class="experimental-badge">Experimental</span></div>
              <div class="field-description">Nudges the unlocked values per call: more focused while the agent is coding, more varied for creative writing. Off by default; it has no measured benefit yet and different models react differently.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="config.sampling.dynamic"
                       @change="if ($event.target.checked && !confirm('Experimental feature.\n\nDynamic sampling changes temperature, top P and repeat penalty on every call based on what the agent is doing. It is not proven to help and can make some models worse. Locked values are never changed.\n\nTurn it on?')) { config.sampling.dynamic = false; $event.target.checked = false; }" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>
        </div>
        </template>

        <!-- Background jobs: which model runs what -->
        <template x-if="config.job_routing">
        <div class="model-section"
             x-data="{ jobs: [
               ['rename_chat', 'Naming chats'],
               ['memory_recall', 'Finding memories for a step'],
               ['memorize', 'Saving memories'],
               ['memory_consolidation', 'Merging memories'],
               ['history_compression', 'Compressing history'],
               ['skill_learn', 'Learning skills'],
             ] }">
          <div class="section-title" x-init="$store.modelConfig._presetsLoaded || $store.modelConfig.loadGlobalPresets()">Background jobs</div>
          <div class="section-description">Useful when the Utility model runs on another PC. The safety check is set separately, in its own plugin settings.</div>
          <div class="field">
            <div class="field-label">
              <div class="field-title">Use the Main model when Utility doesn't answer</div>
              <div class="field-description">Keeps memory and compression working while the other PC is off or asleep. Replies are slower until it's back.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="config.job_routing.fallback_to_main" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>
          <template x-for="[job, label] in jobs" :key="job">
            <div class="field">
              <div class="field-label">
                <div class="field-title" x-text="label"></div>
              </div>
              <div class="field-control">
                <select :value="(config.job_routing.jobs || {})[job] || 'utility'"
                        @change="config.job_routing.jobs = { ...(config.job_routing.jobs || {}), [job]: $event.target.value }">
                  <option value="utility">Utility model</option>
                  <option value="main">Main model</option>
                  <template x-for="preset in ($store.modelConfig.globalPresets || [])" :key="preset.name">
                    <option :value="'preset:' + preset.name" x-text="'Preset: ' + preset.name"></option>
                  </template>
                </select>
              </div>
            </div>
          </template>
          <div class="field">
            <div class="field-label">
              <div class="field-title">Model per agent profile</div>
              <div class="field-description">One line per profile: <code>researcher = utility</code>, <code>developer = preset:Max Power</code> or <code>= main</code>. Applies to subordinates and child agents; your own chat keeps the Main model. Their safety checks stay on the model set for the check.</div>
            </div>
            <div class="field-control">
              <textarea rows="3" placeholder="researcher = utility"
                        :value="[...(config.job_routing.subordinate_profiles || []).map(p => p + ' = utility'), ...(typeof config.job_routing.profile_models === 'string' ? config.job_routing.profile_models.split('\n') : Object.entries(config.job_routing.profile_models || {}).map(([k, v]) => k + ' = ' + v))].filter(Boolean).join('\n')"
                        @change="config.job_routing.profile_models = $event.target.value; config.job_routing.subordinate_profiles = []"></textarea>
            </div>
          </div>
          <div class="field" x-data="{ status: null, async load() { try { const { callJsonApi } = await import('/js/api.js'); this.status = await callJsonApi('/plugins/_model_config/routing_status', {}); } catch { this.status = null; } } }" x-init="load()">
            <div class="field-label">
              <div class="field-title">Recent fallbacks</div>
              <div class="field-description">When a job moved to the Main model, and why. Cleared on restart.</div>
            </div>
            <div class="field-control routing-status">
              <template x-for="server in (status?.servers || [])" :key="server.server">
                <div><span x-text="server.up ? 'up' : 'down'"></span> <code x-text="server.server"></code> <span x-text="server.reason"></span></div>
              </template>
              <template x-for="item in (status?.fallbacks || [])" :key="item.ts">
                <div x-text="new Date(item.ts * 1000).toLocaleTimeString() + '  ' + item.caller + ': ' + item.reason"></div>
              </template>
              <div x-show="status && !status.fallbacks.length">None since the last restart.</div>
            </div>
          </div>
          <template x-if="config.job_routing.decision_shadow">
            <div class="field">
              <div class="field-label">
                <div class="field-title">Decision model in shadow mode</div>
                <div class="field-description">Compare only: a decision model such as Laya, on the Utility model's server, predicts whether a step needs thinking and how hard a delegated task is. The predictions are logged next to what really happened. It never changes what runs.</div>
              </div>
              <div class="field-control">
                <label class="toggle">
                  <input type="checkbox" x-model="config.job_routing.decision_shadow.enabled" />
                  <span class="toggler"></span>
                </label>
              </div>
            </div>
          </template>
          <template x-if="config.job_routing.tool_digest">
            <div class="field">
              <div class="field-label">
                <div class="field-title">Shorten very long tool results (experimental)</div>
                <div class="field-description">The Utility model summarizes the middle of long outputs, so later steps read less. The start and end stay word for word and the full text is saved, but a detail in the middle can be lost from what the agent sees.</div>
              </div>
              <div class="field-control">
                <label class="toggle">
                  <input type="checkbox" x-model="config.job_routing.tool_digest.enabled" />
                  <span class="toggler"></span>
                </label>
              </div>
            </div>
          </template>
        </div>
        </template>

        <!-- Per-Chat Override -->
        <div class="model-section">
          <div class="section-title">Per-Chat Override</div>
          <div class="section-description">Allow switching model presets from the chat navigation bar. New chats inherit the active preset.</div>
          <div class="field">
            <div class="field-label">
              <div class="field-title">Enable model switcher</div>
              <div class="field-description">Show a preset switcher in the chat navigation bar. Overrides main and utility model for the current chat.</div>
            </div>
            <div class="field-control">
              <label class="toggle">
                <input type="checkbox" x-model="config.allow_chat_override" />
                <span class="toggler"></span>
              </label>
            </div>
          </div>
          <div class="override-presets-link" x-show="config.allow_chat_override">
            <button class="text-button" @click="openModal('/plugins/_model_config/webui/main.html')">
              <span class="material-symbols-outlined">tune</span>
              <span>Edit Presets</span>
            </button>
          </div>
        </div>

        <!-- Concurrency -->
        <div class="model-section">
          <div class="section-title">Concurrency</div>
          <div class="section-description">Serializes concurrent Main/Utility model calls through a shared limit, so a local single-process inference backend isn't hit with simultaneous requests it can't handle.</div>
          <div class="field">
            <div class="field-label">
              <div class="field-title">Max concurrent model calls</div>
              <div class="field-description">1 fully serializes every model call. Raise this only if your backend genuinely supports concurrent generation.</div>
            </div>
            <div class="field-control">
              <input type="number" min="1" x-model.number="config.max_concurrent_model_calls" />
            </div>
          </div>
        </div>

      </div>
    </template>
  </div>

<style>
  .model-config-sections {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .model-section {
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 16px;
  }
  .model-section .section-title {
    margin-top: 0;
  }
  .override-presets-link {
    margin-top: 4px;
  }
  .sampling-lock {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    font-size: 0.8rem;
    opacity: 0.85;
  }
  .experimental-badge {
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
    background: color-mix(in srgb, var(--color-warning, #d9a400) 25%, transparent);
    border: 1px solid var(--color-warning, #d9a400);
    vertical-align: middle;
  }
  .override-presets-link .text-button {
    font-size: 0.78rem !important;
    gap: 4px;
  }

</style>
</body>
</html>
