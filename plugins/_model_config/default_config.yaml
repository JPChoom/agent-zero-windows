allow_chat_override: true

# Serializes concurrent Main/Utility model calls through a shared
# semaphore (helpers/model_concurrency.py) - default 1 (fully
# serialized), since a local single-process inference backend (LM
# Studio, etc.) can't reliably handle simultaneous requests. Raise this
# if your backend genuinely supports concurrent generation (e.g. a
# hosted API with its own concurrency handling).
max_concurrent_model_calls: 1

# Local-first defaults: point at LM Studio (the most common local backend,
# and the one this fork's concurrency/caching handling is specifically
# tuned around - see helpers/model_concurrency.py and
# helpers/litellm_transport.py). api_base is left blank so it inherits
# conf/model_providers.yaml's provider-level default (models.py only
# applies an explicit api_base here if it's non-empty); name is left
# blank since it depends on whatever model the user has loaded - the
# Settings UI's model search discovers it. Any LiteLLM-supported provider
# (OpenRouter, Anthropic, OpenAI, Ollama, etc.) still works - this is
# just which one a fresh install starts pointed at.
chat_model:
  provider: "lm_studio"
  name: ""
  api_base: ""
  ctx_length: 32000
  ctx_history: 0.7
  ctx_output: 0.1
  vision: false
  max_embeds: 10
  rl_requests: 0
  rl_input: 0
  rl_output: 0
  kwargs: {}

utility_model:
  provider: "lm_studio"
  name: ""
  api_base: ""
  ctx_length: 32000
  ctx_input: 0.7
  rl_requests: 0
  rl_input: 0
  rl_output: 0
  kwargs: {}

embedding_model:
  provider: "huggingface"
  name: "sentence-transformers/all-MiniLM-L6-v2"
  api_base: ""
  rl_requests: 0
  rl_input: 0
  kwargs: {}

# Optional sidecar: when the Main model has vision=false and an image is
# attached, vision_load calls this model instead of embedding a raw image
# the Main model can't see - it captions the image once and hands back
# text. Left unconfigured (blank name) by default; vision_load falls back
# to a plain notice when neither this nor Main's own vision is available.
vision_model:
  provider: "lm_studio"
  name: ""
  api_base: ""
  ctx_length: 8000
  rl_requests: 0
  rl_input: 0
  rl_output: 0
  kwargs: {}

# Use the Main model for the Utility slot too, and no separate vision
# sidecar (the Main model's own vision setting decides). Embeddings stay
# separate. Handy with one local model (LM Studio or the llama.cpp server).
single_model_mode: false

# Sampling for the Main and Utility models. Empty (null) = the provider's
# default. A model's own kwargs (in its settings) win over these.
# temperature and top_p go to every provider; top_k and repeat_penalty only
# to local OpenAI-compatible servers (llama.cpp, LM Studio, Ollama, vLLM).
sampling:
  temperature: null
  top_p: null
  top_k: null
  repeat_penalty: null
  # Locked values are never changed by the experimental dynamic adjustment.
  locks:
    temperature: false
    top_p: false
    top_k: false
    repeat_penalty: false
  # EXPERIMENTAL, off by default: adjust the unlocked values per call from
  # what the agent is doing (coding / creative writing / everything else).
  # No measured benefit yet - see the Windows workflow benchmark.
  dynamic: false
  dynamic_rules:
    # Tools whose recent use means "coding".
    code_tools: [code_execution_tool, code_execution_remote, input, text_editor, coding_gate]
    # Words in the user's message that mean "creative writing".
    creative_words: [story, poem, poetry, lyrics, brainstorm, creative, fiction, slogan, novel]
    # Offsets from the base values (the preset, or the defaults below).
    offsets:
      code: {temperature: -0.3, top_p: -0.02, repeat_penalty: 0.1}
      creative: {temperature: 0.3, top_p: 0.04, repeat_penalty: 0.4}
      reasoning: {}
    base: {temperature: 0.6, top_p: 0.95, repeat_penalty: 1.0}

# Local model server: Agent Zero starts, watches and stops its own
# llama.cpp server (llama-server.exe) on 127.0.0.1 (helpers/local_server.py,
# helpers/llama_server.py). Picking a model in Settings points the Main and
# Utility slots at it. preset: coding (fast flags, plus MTP self-drafting
# when the model has an MTP layer) | balanced | low_memory | custom
# (extra_args as typed). The context size follows the Main slot while Main
# runs on this server; context_size is used otherwise.
local_server:
  autostart: false
  model_path: ""
  preset: "coding"
  extra_args: ""
  vision: false
  port: 8090
  context_size: 32768
  gpu_layers: 99
  threads: 0
  parallel: 1
  model_folders: []
  binary_path: ""
  download_variant: ""
  vram_check: true
  startup_timeout_seconds: 300
