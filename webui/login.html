<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title>Sign in</title>
    <link rel="stylesheet" href="/login.css">
    <link rel="icon" type="image/svg+xml" href="/public/signin-favicon.svg">
</head>
<body>
    <!-- Deliberately generic: an unauthenticated visitor should not be able
         to tell what application this is (no name, logo, framework assets,
         or external requests). See helpers/ui_server.py PUBLIC_STATIC_PATHS. -->
    <main class="signin">
        <form class="signin-form" method="POST" action="/login{% if next %}?next={{ next|urlencode }}{% endif %}" autocomplete="on">
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <h1>Sign in</h1>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit">Continue</button>
            {% if error %}
                <p class="signin-error" role="alert">{{ error }}</p>
            {% endif %}
        </form>
    </main>
</body>
</html>
