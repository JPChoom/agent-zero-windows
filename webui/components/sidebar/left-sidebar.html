<html>

<head>
  <script type="module">
    import { store as sidebarStore } from "/components/sidebar/sidebar-store.js";
  </script>
  <!-- Wrapper composes existing sidebar components -->
</head>

<body>
  <div x-data>
    <template x-if="$store.sidebar">
      <div class="sidebar-shell">
        <x-component path="sidebar/top-section/header-icons.html"></x-component>
        <!-- Edge tab: the only show/hide control. Sits just right of the
             header pill while open, at the screen edge while hidden. -->
        <button type="button"
                class="sidebar-edge-toggle"
                :class="{ 'is-closed': !$store.sidebar.isOpen }"
                @click="$store.sidebar.toggle()"
                :aria-expanded="$store.sidebar.isOpen"
                :aria-label="$store.sidebar.isOpen ? 'Hide sidebar' : 'Show sidebar'"
                :title="$store.sidebar.isOpen ? 'Hide sidebar' : 'Show sidebar'">
          <span class="material-symbols-outlined" aria-hidden="true"
                x-text="$store.sidebar.isOpen ? 'chevron_left' : 'chevron_right'"></span>
        </button>
        <div id="left-panel" class="panel" x-data :class="{'hidden': !$store.sidebar.isOpen}">
          <x-extension id="sidebar-start"></x-extension>
          <!--Sidebar upper elements-->
          <div class="left-panel-top no-scrollbar">
            <!-- Top Section: Quick Actions -->
            <x-component path="sidebar/top-section/sidebar-top.html"></x-component>
            <!-- Chats List -->
            <div class="config-section" id="chats-section">
              <x-component path="sidebar/chats/chats-list.html"></x-component>
            </div>

            <!-- Tasks List -->
            <div class="config-section" id="tasks-section">
              <x-component path="sidebar/tasks/tasks-list.html"></x-component>
            </div>
          </div>
          <!--Sidebar lower elements-->
          <div class="left-panel-bottom">
            <x-component path="sidebar/bottom/sidebar-bottom.html"></x-component>
          </div>
          <x-extension id="sidebar-end"></x-extension>
        </div>
      </div>
    </template>
  </div>

  <style>
    /* Left Panel styles from index.css */
    #left-panel {
      background-color: var(--color-panel);
      border-right: 1px solid var(--color-border);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all var(--transition-speed) ease-in-out;
      width: 250px;
      min-width: 250px;
      color: var(--color-text);
      box-shadow: 1px 0 5px rgba(0, 0, 0, 0.3);
      user-select: none;
      -webkit-user-select: none;
      /* Safari compatibility */
      height: 100vh;
      /* Ensure full height */
      overflow: hidden;
      /* Prevent overall panel overflow */
    }

    /* Ensure component host behaves like the original direct children for flex layout */
    #left-panel>.left-panel-top,
    #left-panel>.left-panel-bottom {
      display: flex;
      flex-direction: column;
    }

    #left-panel>.left-panel-top {
      flex: 1;
      min-height: 0;
      /* allow inner flex children to shrink properly */
    }

    #left-panel.hidden {
      margin-left: -250px;
    }

    /* Show/hide edge tab. --sidebar-gap (theme.css) insets the floating
       panel; without the theme it is 0. Same timing as the panel slide. */
    .sidebar-edge-toggle {
      position: fixed;
      top: calc(var(--spacing-md) + 1.35rem);
      left: calc(250px + var(--sidebar-gap, 0px) + 6px);
      z-index: 1004;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.35rem;
      height: 2.6rem;
      padding: 0;
      border: 1px solid var(--line-strong, var(--color-border));
      border-radius: 999px;
      background: color-mix(in srgb, var(--s2, var(--color-panel)) var(--mat-alpha, 100%), transparent);
      -webkit-backdrop-filter: var(--mat-filter, none);
      backdrop-filter: var(--mat-filter, none);
      box-shadow: var(--shadow-soft, 0 2px 8px rgba(0, 0, 0, 0.3));
      color: var(--t1, var(--color-text));
      cursor: pointer;
      opacity: 0.75;
      transition: left var(--transition-speed) ease-in-out, opacity 0.15s ease,
                  color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .sidebar-edge-toggle.is-closed {
      left: 6px;
    }
    .sidebar-edge-toggle:hover,
    .sidebar-edge-toggle:focus-visible {
      opacity: 1;
      color: var(--accent-ui, var(--color-text));
      border-color: color-mix(in srgb, var(--accent, var(--color-border)) 50%, transparent);
    }
    .sidebar-edge-toggle .material-symbols-outlined {
      font-size: 18px;
    }

    .left-panel-top {
      flex: 1 1 auto;
      /* Take available space */
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      min-height: 0;
      /* Critical for allowing flex children to shrink */
      overflow: hidden;
      /* flex-start (not space-between): now that #chats-section sizes to
         its content instead of flex-growing to fill this box, space-between
         was spreading the leftover height as gaps BETWEEN children (Quick
         Actions/Chats/Tasks) instead of leaving it after the last one -
         Chats should sit right under the header, not float mid-sidebar. */
      justify-content: flex-start;
      margin-top: 4.75rem;
      padding: var(--spacing-md) var(--spacing-md) 0 var(--spacing-md);
    }

    .left-panel-bottom {
      position: relative;
      flex-shrink: 0;
      flex-grow: 0;
      /* Prevent bottom from growing */
    }

    /* Chats section container inside sidebar. Sized to content (not
       flex-grown) so a short chat list sits right under the header, with
       Tasks pinned at the bottom (margin-top: auto); still capped so a long
       chat list scrolls internally instead of pushing Tasks/Preferences
       off-screen. */
    #chats-section {
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 0 1 auto;
      max-height: 45vh;
      overflow: hidden;
    }

    /* Tasks section container inside sidebar */
    #tasks-section {
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 0 0 auto;
      /* Shrink to content, no reserved space */
      max-height: 40%;
      /* Limit to 40% of viewport height when expanded */
      /* Pinned to the bottom of .left-panel-top, i.e. directly above
         Preferences; the spare height sits between Chats and Tasks. */
      margin-top: auto;
      padding-top: var(--spacing-md);
      overflow: hidden;
    }

    /* Flatten wrapper elements to maintain flex chain for inner scroll containers */
    #chats-section>x-component,
    #chats-section>x-component>div[x-data],
    #tasks-section>x-component,
    #tasks-section>x-component>div[x-data],
    #tasks-section>x-component>div[x-data]>div[x-data] {
      display: contents;
    }

    /* Bootstrap collapse elements need proper display for animation to work */
    #tasks-section .collapse {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    /* During the collapsing transition, allow height animation to control size */
    #tasks-section .collapsing {
      flex: 0 0 auto !important;
    }

    /* Common section header styling (Chats, Tasks) - matching Preferences style */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 0 0 0.5rem 0;
      padding: 0;
      -webkit-user-select: none;
      /* Safari compatibility */
      user-select: none;
      font-size: var(--font-size-normal);
    }

    /* Collapsible section headers (Tasks) */
    .section-header-collapsible {
      cursor: pointer;
    }

    .light-mode #left-panel {
      box-shadow: 1px 0 10px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      #left-panel {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 250px !important;
        /* Force width */
        min-width: 250px;
        z-index: 1003;
        transition: all var(--transition-speed) ease-in-out;
      }

      #left-panel.hidden {
        margin-left: -250px;
      }
    }

    @media (max-height: 600px) {
      #chats-section {
        min-height: 100%;
      }

      .left-panel-top {
        overflow-y: auto;
        -webkit-scroll-behavior: smooth;
        scroll-behavior: smooth;
      }
    }
  </style>
</body>

</html>
