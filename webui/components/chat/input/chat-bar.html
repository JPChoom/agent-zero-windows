<html>
<head>
    <script type="module">
        import { store } from "/components/chat/input/input-store.js";
        import { store as messageQueueStore } from "/components/chat/message-queue/message-queue-store.js";
    </script>
</head>
<body>
    <div id="input-section" x-data
        x-init="new ResizeObserver(([e]) => document.documentElement.style.setProperty('--composer-height', Math.ceil(e.target.getBoundingClientRect().height) + 'px')).observe($el)">
        <x-extension id="chat-input-start"></x-extension>
        <template x-if="$store.chatInput">
            <div style="width: 100%; display: contents;">
                <!-- Message Queue section -->
                <x-component path="chat/message-queue/message-queue.html"></x-component>

                <!-- Attachment Preview section -->
                <div>
                    <x-component path="chat/attachments/inputPreview.html" />
                </div>

                <x-component path="chat/input/chat-bar-input.html"></x-component>
                <x-component path="chat/input/bottom-actions-bar.html"></x-component>
            </div>
        </template>
        <x-extension id="chat-input-end"></x-extension>
    </div>


    <style>
    /* Input section wrapper: floats as an overlay over the bottom of the
       chat scroll area (position: absolute, anchored to #right-panel,
       which is position: relative - see index.css) instead of taking its
       own row and pushing the chat up. Transparent background so only the
       .input-row pill itself (its own glass styling) reads as a surface;
       the ::before pseudo-element behind it is a progressive blur so chat
       content is still legible as it scrolls underneath, fading to a
       stronger blur toward the bottom edge instead of a hard cutoff. */
    #input-section {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: transparent;
      display: -webkit-flex;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xxs);
      padding: var(--spacing-xxs) var(--spacing-md) var(--spacing-xs) 0.8rem;
      align-items: start;
      place-items: normal;
      overflow: visible;
      z-index: 1001;
    }

    #input-section::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      /* Blur starts ~16px above the input pill itself, not far up into the
         chat - only the last bit of scrolled content fades right before
         it would touch the box. */
      top: -16px;
      bottom: 0;
      z-index: -1;
      pointer-events: none;
      backdrop-filter: blur(48px);
      -webkit-backdrop-filter: blur(48px);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.5) 50%, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.5) 50%, black 100%);
    }

    @media (max-width: 768px) {
      #input-section { align-items: normal !important; }
    }

    </style>
</body>
</html>
