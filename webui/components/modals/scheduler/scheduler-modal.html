<html>
<head>
  <title>Tasks</title>
  <script type="module">
    import { store } from "/components/modals/scheduler/scheduler-store.js";
  </script>
</head>
<body>
  <div x-data x-init="$store.schedulerStore.onTabActivated()" x-destroy="$store.schedulerStore.onModalClosed()">
    <template x-if="$store.schedulerStore">
      <div class="scheduler-modal-content">
        <div id="scheduler-settings-root" class="scheduler-dashboard">
          <div class="scheduler-dashboard-description">Manage tasks and automated processes for Agent Zero.</div>
          <div class="scheduler-global-setting">
            <span class="scheduler-global-setting-label">
              Catch up on missed scheduled runs
              <span class="scheduler-global-setting-help">If the server was off when a task was due, run it once as soon as it's back instead of skipping to the next occurrence.</span>
            </span>
            <label class="switch">
              <input type="checkbox" :checked="$store.schedulerStore.catchUpMissedRuns" @change="$store.schedulerStore.toggleCatchUpMissedRuns()">
              <span class="slider"></span>
            </label>
          </div>
          <x-component path="modals/scheduler/scheduler-task-editor.html"></x-component>
          <x-component path="modals/scheduler/scheduler-task-list.html"></x-component>
        </div>
      </div>
    </template>

    <!-- Modal Footer (exists immediately so modals.js can move it) -->
    <template x-if="$store.schedulerStore">
      <div class="modal-footer scheduler-modal-footer" data-modal-footer
           x-show="$store.schedulerStore.isCreating || $store.schedulerStore.isEditing">
        <div class="buttons-container scheduler-modal-footer-actions">
          <div class="buttons-left">
            <button type="button" class="button cancel"
                    x-show="$store.schedulerStore.isEditing"
                    @click="$confirmClick($event, () => $store.schedulerStore.deleteTask($store.schedulerStore.editingTask.uuid))">Delete</button>
          </div>
          <div class="buttons-right">
            <button type="button" class="button confirm"
                    @click="$store.schedulerStore.saveTask()">Save</button>
            <button type="button" class="button cancel"
                    @click="$store.schedulerStore.cancelEdit()">Cancel</button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <style>
    .scheduler-modal-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 400px;
    }
    .scheduler-dashboard {
      padding: 0;
    }
    .scheduler-dashboard-description {
      padding: 0 0 1rem 0;
    }

    .scheduler-global-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-panel);
    }

    .scheduler-global-setting-label {
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .scheduler-global-setting-help {
      font-size: 0.72rem;
      opacity: 0.65;
      font-weight: 400;
    }

    .scheduler-modal-footer {
      padding: 0.6rem 1rem;
    }

    .scheduler-modal-footer-actions {
      width: 100%;
    }
  </style>
</body>
</html>
