<html>
<head>
  <title>Recently deleted</title>
  <script type="module">
    import { store } from "/components/modals/chat-trash/chat-trash-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.chatTrash">
      <div class="chat-trash-root" x-init="$store.chatTrash.refresh()">
        <p class="chat-trash-intro">
          Deleted chats stay here for
          <strong x-text="$store.chatTrash.retentionDays + ' days'"></strong>
          and can be restored with their full history. After that they are deleted forever.
        </p>

        <template x-if="$store.chatTrash.loading && !$store.chatTrash.items.length">
          <div class="chat-trash-empty">Loading…</div>
        </template>

        <template x-if="$store.chatTrash.error">
          <div class="chat-trash-empty chat-trash-error" x-text="$store.chatTrash.error"></div>
        </template>

        <template x-if="!$store.chatTrash.loading && !$store.chatTrash.error && !$store.chatTrash.items.length">
          <div class="chat-trash-empty">
            <span class="material-symbols-outlined">delete</span>
            <span>No recently deleted chats.</span>
          </div>
        </template>

        <ul class="chat-trash-list" x-show="$store.chatTrash.items.length">
          <template x-for="item in $store.chatTrash.items" :key="item.trash_id">
            <li class="chat-trash-item">
              <div class="chat-trash-info">
                <div class="chat-trash-name" x-text="$store.chatTrash.displayName(item)"></div>
                <div class="chat-trash-meta">
                  <span x-text="'Deleted ' + $store.chatTrash.formatDate(item.deleted_at)"></span>
                  <span class="chat-trash-sep">·</span>
                  <span x-text="$store.chatTrash.daysLeft(item)"></span>
                </div>
              </div>
              <div class="chat-trash-actions">
                <button type="button" class="btn btn-field"
                        :disabled="!!$store.chatTrash.busy[item.trash_id]"
                        @click="$store.chatTrash.restore(item.trash_id); closeModal()">
                  Restore
                </button>
                <button type="button" class="btn btn-cancel"
                        :disabled="!!$store.chatTrash.busy[item.trash_id]"
                        @click="$confirmClick($event, () => $store.chatTrash.deleteForever(item.trash_id))">
                  Delete forever
                </button>
              </div>
            </li>
          </template>
        </ul>

        <div data-modal-footer class="modal-footer">
          <button type="button" class="btn btn-cancel"
                  x-show="$store.chatTrash.items.length"
                  @click="$confirmClick($event, () => $store.chatTrash.emptyTrash())">
            Empty trash
          </button>
          <button type="button" class="btn btn-ok" @click="closeModal()">Close</button>
        </div>
      </div>
    </template>
  </div>

  <style>
    .chat-trash-root {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      min-width: min(560px, 80vw);
    }

    .chat-trash-intro {
      margin: 0;
      color: var(--color-text-muted);
      font-size: .85rem;
    }

    .chat-trash-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4rem;
      padding: 2rem 1rem;
      color: var(--color-text-muted);
    }

    .chat-trash-empty .material-symbols-outlined { font-size: 28px; opacity: .6; }
    .chat-trash-error { color: var(--color-error-text, #e05555); }

    .chat-trash-list {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .chat-trash-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .65rem .8rem;
      border: 1px solid var(--color-border);
      border-radius: 12px;
    }

    .chat-trash-info { flex: 1; min-width: 0; }

    .chat-trash-name {
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-trash-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin-top: .15rem;
      color: var(--color-text-muted);
      font-size: .75rem;
    }

    .chat-trash-sep { opacity: .6; }

    .chat-trash-actions {
      display: flex;
      flex: 0 0 auto;
      gap: .4rem;
    }

    @media (max-width: 640px) {
      .chat-trash-item { flex-direction: column; align-items: stretch; }
      .chat-trash-actions { justify-content: flex-end; }
    }
  </style>
</body>
</html>
