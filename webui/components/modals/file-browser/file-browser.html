<html
  class="surface-modal file-browser-modal modal-no-backdrop"
  data-surface-id="files"
  data-surface-modal-path="modals/file-browser/file-browser.html"
  data-surface-dock-title="Open Files in canvas"
  data-surface-dock-icon="dock_to_right"
  data-canvas-surface="files"
  data-canvas-modal-path="modals/file-browser/file-browser.html"
  data-canvas-dock-title="Open Files in canvas"
  data-canvas-dock-icon="dock_to_right"
>
<head>
  <title>Files</title>
  <script type="module">
    import { store } from "/components/modals/file-browser/file-browser-store.js";
  </script>
</head>
<body class="file-browser-modal-body">
  <div
    x-data
    class="file-browser-shell"
    :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas' }"
    x-create="$store.fileBrowser.onMount($el, xAttrs($el) || {})"
    x-destroy="$store.fileBrowser.onUnmount(xAttrs($el) || {})"
  >
    <template x-if="$store.fileBrowser">
      <div class="fb" tabindex="0" x-data="{ get fb() { return $store.fileBrowser } }"
           @keydown="fb.onKeydown($event)" @keydown.window="fb.onWindowKeydown($event)" @click="fb.menu = null">

        <!-- Navigation bar -->
        <div class="fb-navbar">
          <button type="button" class="fb-icon-btn" title="Back (Alt+Left)" :disabled="!fb.back.length" @click="fb.goBack()">
            <span class="material-symbols-outlined">arrow_back</span></button>
          <button type="button" class="fb-icon-btn" title="Forward (Alt+Right)" :disabled="!fb.forward.length" @click="fb.goForward()">
            <span class="material-symbols-outlined">arrow_forward</span></button>
          <button type="button" class="fb-icon-btn" title="Up (Alt+Up)" :disabled="!fb.parent" @click="fb.goUp()">
            <span class="material-symbols-outlined">arrow_upward</span></button>
          <button type="button" class="fb-icon-btn" title="Refresh (F5)" @click="fb.refresh()">
            <span class="material-symbols-outlined" :class="{ 'fb-spin': fb.isLoading }">refresh</span></button>

          <div class="fb-address" @click.self="fb.startAddressEdit()">
            <template x-if="!fb.editingAddress">
              <div class="fb-crumbs" @click.self="fb.startAddressEdit()">
                <span class="material-symbols-outlined fb-crumb-icon">folder_open</span>
                <template x-for="(crumb, i) in fb.breadcrumbs" :key="crumb.path">
                  <span class="fb-crumb">
                    <span class="material-symbols-outlined fb-crumb-sep" x-show="i > 0">chevron_right</span>
                    <button type="button" :disabled="!fb.crumbAllowed(crumb.path)" :title="crumb.path"
                            @click.stop="fb.navigate(crumb.path)" x-text="crumb.name"></button>
                  </span>
                </template>
              </div>
            </template>
            <template x-if="fb.editingAddress">
              <input type="text" class="fb-address-input" spellcheck="false" x-model="fb.addressInput"
                     x-init="$nextTick(() => { $el.focus(); $el.select() })"
                     @keydown.enter.prevent="fb.submitAddress()" @keydown.escape.prevent="fb.editingAddress = false"
                     @blur="fb.editingAddress = false" aria-label="Folder path" />
            </template>
          </div>

          <label class="fb-search">
            <span class="material-symbols-outlined">search</span>
            <input type="search" placeholder="Search" x-model="fb.searchQuery" aria-label="Search this folder" />
          </label>
        </div>

        <!-- Command bar -->
        <div class="fb-commands" x-show="!fb.isPickerMode()">
          <button type="button" class="fb-cmd" :disabled="!fb.writable" @click="fb.newFolder()" title="New folder (Ctrl+Shift+N)">
            <span class="material-symbols-outlined">create_new_folder</span><span>New folder</span></button>
          <button type="button" class="fb-cmd" :disabled="!fb.writable" @click="fb.newTextFile()" title="New text file">
            <span class="material-symbols-outlined">note_add</span><span>New file</span></button>
          <label class="fb-cmd" :class="{ 'is-disabled': !fb.writable }" title="Upload files">
            <span class="material-symbols-outlined">upload</span><span>Upload</span>
            <input type="file" multiple hidden :disabled="!fb.writable" @change="fb.pickUpload($event)" />
          </label>
          <span class="fb-cmd-sep"></span>
          <button type="button" class="fb-cmd fb-cmd-icon" :disabled="!fb.selectedEntries.length" @click="fb.copySelection(true)" title="Cut (Ctrl+X)">
            <span class="material-symbols-outlined">content_cut</span></button>
          <button type="button" class="fb-cmd fb-cmd-icon" :disabled="!fb.selectedEntries.length" @click="fb.copySelection(false)" title="Copy (Ctrl+C)">
            <span class="material-symbols-outlined">content_copy</span></button>
          <button type="button" class="fb-cmd fb-cmd-icon" :disabled="!fb.clipboard || !fb.writable" @click="fb.paste()" title="Paste (Ctrl+V)">
            <span class="material-symbols-outlined">content_paste</span></button>
          <button type="button" class="fb-cmd fb-cmd-icon" :disabled="fb.selectedEntries.length !== 1" @click="fb.renameSelected()" title="Rename (F2)">
            <span class="material-symbols-outlined">edit</span></button>
          <button type="button" class="fb-cmd fb-cmd-icon" :disabled="!fb.selectedEntries.length" @click="fb.requestDelete(false)" title="Delete (Del; Shift+Del deletes permanently)">
            <span class="material-symbols-outlined">delete</span></button>
          <span class="fb-cmd-sep"></span>
          <button type="button" class="fb-cmd" :disabled="!fb.selectedEntries.length" @click="fb.download()" title="Download (folders and multiple items as a ZIP)">
            <span class="material-symbols-outlined">download</span><span>Download</span></button>
          <span class="fb-grow"></span>
          <button type="button" class="fb-cmd fb-cmd-icon" :class="{ 'is-on': fb.showNav }" @click="fb.toggleNav()" title="Navigation pane">
            <span class="material-symbols-outlined">side_navigation</span></button>
          <button type="button" class="fb-cmd fb-cmd-icon" :class="{ 'is-on': fb.showPreview }" @click="fb.togglePreview()" title="Preview pane">
            <span class="material-symbols-outlined">vertical_split</span></button>
          <button type="button" class="fb-cmd fb-cmd-icon" :class="{ 'is-on': fb.showHidden }" @click="fb.toggleHidden()" title="Show hidden items">
            <span class="material-symbols-outlined" x-text="fb.showHidden ? 'visibility' : 'visibility_off'"></span></button>
        </div>

        <div class="fb-body">
          <!-- Navigation pane -->
          <nav class="fb-nav" x-show="fb.showNav" aria-label="Places">
            <div class="fb-nav-title">Quick access</div>
            <template x-for="place in fb.places.quick" :key="place.path">
              <button type="button" class="fb-nav-item" :class="{ 'is-current': place.path.toLowerCase() === fb.path.toLowerCase() }"
                      :title="place.path" @click="fb.navigateFromPane(place.path)">
                <span class="material-symbols-outlined" x-text="({desktop:'desktop_windows', documents:'description', downloads:'download', pictures:'image', music:'music_note', videos:'movie'})[place.icon] || place.icon"></span>
                <span x-text="place.name"></span>
              </button>
            </template>
            <div class="fb-nav-title">This PC</div>
            <template x-for="drive in fb.places.drives" :key="drive.root">
              <button type="button" class="fb-nav-item fb-drive" :class="{ 'is-locked': !drive.allowed && !drive.partly }"
                      :disabled="!drive.allowed && !drive.partly"
                      :title="drive.allowed ? drive.root : drive.partly ? 'Only some folders on this drive are open to the File Browser' : 'Not allowed by Settings > Security > File Browser access'"
                      @click="drive.allowed && fb.navigateFromPane(drive.root)">
                <span class="material-symbols-outlined" x-text="fb.driveIcon(drive)"></span>
                <span class="fb-drive-text">
                  <span class="fb-drive-name" x-text="(drive.label || (drive.kind === 'removable' ? 'USB Drive' : 'Local Disk')) + ' (' + drive.root.slice(0, 2) + ')'"></span>
                  <span class="fb-drive-bar"><span :style="`width: ${fb.driveUsage(drive)}%`" :class="{ 'is-full': fb.driveUsage(drive) > 90 }"></span></span>
                  <span class="fb-drive-free" x-text="fb.formatSize(drive.free) + ' free of ' + fb.formatSize(drive.total)"></span>
                </span>
                <span class="material-symbols-outlined fb-lock" x-show="!drive.allowed" x-text="drive.partly ? 'lock_open_right' : 'lock'"></span>
              </button>
            </template>
            <div class="fb-nav-note" x-show="fb.places.policy?.remote">
              <span class="material-symbols-outlined">public</span> Remote session: access is limited by the remote setting.
            </div>
          </nav>

          <!-- File list -->
          <section class="fb-main" @contextmenu.prevent="fb.openMenu($event)" @pointerdown="fb.showNav && fb.isNarrow() && (fb.showNav = false)"
                   @dragover.prevent="fb.dragOver = !fb.isPickerMode() && $event.dataTransfer?.types?.includes('Files')"
                   @dragleave.self="fb.dragOver = false" @drop.prevent="fb.onDrop($event)">
            <div class="fb-header">
              <button type="button" @click="fb.sortBy('name')">Name <span class="material-symbols-outlined" x-text="fb.sortIndicator('name')"></span></button>
              <button type="button" class="fb-col-modified" @click="fb.sortBy('modified')">Date modified <span class="material-symbols-outlined" x-text="fb.sortIndicator('modified')"></span></button>
              <button type="button" class="fb-col-type" @click="fb.sortBy('type')">Type <span class="material-symbols-outlined" x-text="fb.sortIndicator('type')"></span></button>
              <button type="button" class="fb-col-size" @click="fb.sortBy('size')">Size <span class="material-symbols-outlined" x-text="fb.sortIndicator('size')"></span></button>
            </div>
            <div class="fb-rows" @click.self="fb.clearSelection()" role="listbox" aria-multiselectable="true">
              <template x-for="entry in fb.visibleEntries" :key="entry.path">
                <div class="fb-row" role="option" :data-path="entry.path" :aria-selected="fb.isSelected(entry)"
                     :class="{ 'is-selected': fb.isSelected(entry), 'is-focus': fb.focusPath === entry.path, 'is-hidden': entry.hidden || entry.system, 'is-cut': fb.isCut(entry) }"
                     :title="entry.outside ? 'This link points outside what the File Browser may open' : ''"
                     @click.stop="fb.clickEntry(entry, $event)" @dblclick="fb.activate(entry)"
                     @contextmenu.prevent.stop="fb.openMenu($event, entry)">
                  <span class="fb-name">
                    <span class="material-symbols-outlined fb-file-icon" :class="{ 'is-folder': entry.is_dir }" x-text="fb.iconFor(entry)"></span>
                    <span class="fb-name-text" x-text="entry.name"></span>
                    <span class="material-symbols-outlined fb-badge" x-show="entry.is_link" title="Link">shortcut</span>
                    <span class="material-symbols-outlined fb-badge" x-show="entry.readonly && !entry.is_dir" title="Read-only">lock</span>
                    <button type="button" class="fb-surface-btn" x-show="fb.surfaceAction(entry) && !fb.isPickerMode()"
                            :title="fb.surfaceAction(entry)?.label" @click.stop="fb.openInSurface(entry)">
                      <span class="material-symbols-outlined" x-text="fb.surfaceAction(entry)?.icon"></span>
                    </button>
                  </span>
                  <span class="fb-col-modified" x-text="fb.formatDate(entry.modified)"></span>
                  <span class="fb-col-type" x-text="fb.typeLabel(entry)"></span>
                  <span class="fb-col-size" x-text="entry.is_dir ? '' : fb.formatSize(entry.size)"></span>
                </div>
              </template>
              <div class="fb-empty" x-show="!fb.isLoading && !fb.visibleEntries.length">
                <template x-if="fb.error"><span x-text="fb.error"></span></template>
                <template x-if="!fb.error"><span x-text="fb.searchQuery ? 'No items match your search.' : 'This folder is empty.'"></span></template>
              </div>
            </div>
            <div class="fb-drop" x-show="fb.dragOver">
              <span class="material-symbols-outlined">upload_file</span>
              <span x-text="'Drop to upload to ' + (fb.breadcrumbs.at(-1)?.name || fb.path)"></span>
            </div>
          </section>

          <!-- Preview pane -->
          <aside class="fb-preview" x-show="fb.showPreview">
            <template x-if="!fb.preview">
              <div class="fb-preview-empty">Select a file to preview it.</div>
            </template>
            <template x-if="fb.preview?.kind === 'many'">
              <div class="fb-preview-empty" x-text="fb.preview.count + ' items selected'"></div>
            </template>
            <template x-if="fb.preview?.entry">
              <div class="fb-preview-content">
                <template x-if="fb.preview.kind === 'image'">
                  <img class="fb-preview-image" :src="fb.preview.url" :alt="fb.preview.entry.name" />
                </template>
                <template x-if="fb.preview.kind === 'pdf'">
                  <iframe class="fb-preview-frame" :src="fb.preview.url" sandbox title="PDF preview"></iframe>
                </template>
                <template x-if="fb.preview.kind === 'text'">
                  <pre class="fb-preview-text" x-text="fb.preview.text"></pre>
                </template>
                <template x-if="fb.preview.kind === 'info' || fb.preview.kind === 'loading'">
                  <div class="fb-preview-icon"><span class="material-symbols-outlined" x-text="fb.iconFor(fb.preview.entry)"></span></div>
                </template>
                <dl class="fb-props">
                  <dt>Name</dt><dd x-text="fb.preview.entry.name"></dd>
                  <dt>Type</dt><dd x-text="fb.typeLabel(fb.preview.entry)"></dd>
                  <template x-if="!fb.preview.entry.is_dir"><dt>Size</dt></template>
                  <template x-if="!fb.preview.entry.is_dir"><dd x-text="fb.formatSize(fb.preview.entry.size)"></dd></template>
                  <dt>Modified</dt><dd x-text="fb.formatDate(fb.preview.entry.modified)"></dd>
                  <dt>Location</dt><dd class="fb-props-path" x-text="fb.path"></dd>
                </dl>
              </div>
            </template>
          </aside>
        </div>

        <!-- Status bar -->
        <div class="fb-status">
          <span x-text="fb.statusText"></span>
          <span class="fb-grow"></span>
          <template x-for="job in fb.uploads" :key="job.id">
            <span class="fb-upload"><span x-text="'Uploading ' + job.name"></span>
              <span class="fb-upload-bar"><span :style="`width: ${job.progress}%`"></span></span></span>
          </template>
          <span x-show="!fb.writable" class="fb-status-flag"><span class="material-symbols-outlined">lock</span> Read-only</span>
          <span x-show="fb.driveKind === 'removable'" class="fb-status-flag"><span class="material-symbols-outlined">usb</span> Removable drive</span>
        </div>

        <!-- Context menu -->
        <template x-if="fb.menu">
          <div class="fb-menu" :style="`left:${fb.menu.x}px; top:${fb.menu.y}px`" @click.stop @contextmenu.prevent>
            <template x-if="fb.menu.entry">
              <div>
                <button type="button" @click="fb.activate(fb.menu.entry); fb.menu = null">
                  <span class="material-symbols-outlined" x-text="fb.menu.entry.is_dir ? 'folder_open' : 'open_in_new'"></span>Open</button>
                <template x-if="fb.surfaceAction(fb.menu.entry)">
                  <button type="button" @click="fb.openInSurface(fb.menu.entry)">
                    <span class="material-symbols-outlined" x-text="fb.surfaceAction(fb.menu.entry).icon"></span><span x-text="fb.surfaceAction(fb.menu.entry).label"></span></button>
                </template>
                <template x-if="fb.isTextFile(fb.menu.entry)">
                  <button type="button" @click="fb.editText(fb.menu.entry)"><span class="material-symbols-outlined">edit_note</span>Edit as text</button>
                </template>
                <button type="button" @click="fb.download()"><span class="material-symbols-outlined">download</span>
                  <span x-text="fb.selectedEntries.length > 1 || fb.menu.entry.is_dir ? 'Download as ZIP' : 'Download'"></span></button>
                <hr />
                <button type="button" @click="fb.copySelection(true)"><span class="material-symbols-outlined">content_cut</span>Cut<kbd>Ctrl+X</kbd></button>
                <button type="button" @click="fb.copySelection(false)"><span class="material-symbols-outlined">content_copy</span>Copy<kbd>Ctrl+C</kbd></button>
                <button type="button" @click="fb.copyPaths()"><span class="material-symbols-outlined">link</span>Copy path</button>
                <button type="button" x-show="fb.selectedEntries.length === 1" @click="fb.renameSelected()"><span class="material-symbols-outlined">edit</span>Rename<kbd>F2</kbd></button>
                <button type="button" @click="fb.requestDelete(false)"><span class="material-symbols-outlined">delete</span>Delete<kbd>Del</kbd></button>
                <template x-if="!fb.isRemote">
                  <div><hr /><button type="button" @click="fb.reveal(fb.menu.entry)"><span class="material-symbols-outlined">folder_eye</span>Show in File Explorer</button></div>
                </template>
              </div>
            </template>
            <template x-if="!fb.menu.entry">
              <div>
                <button type="button" :disabled="!fb.writable" @click="fb.newFolder()"><span class="material-symbols-outlined">create_new_folder</span>New folder</button>
                <button type="button" :disabled="!fb.writable" @click="fb.newTextFile()"><span class="material-symbols-outlined">note_add</span>New text file</button>
                <button type="button" :disabled="!fb.clipboard || !fb.writable" @click="fb.paste()"><span class="material-symbols-outlined">content_paste</span>Paste<kbd>Ctrl+V</kbd></button>
                <hr />
                <button type="button" @click="fb.refresh(); fb.menu = null"><span class="material-symbols-outlined">refresh</span>Refresh<kbd>F5</kbd></button>
                <button type="button" @click="fb.selectAll(); fb.menu = null"><span class="material-symbols-outlined">select_all</span>Select all<kbd>Ctrl+A</kbd></button>
                <button type="button" @click="fb.copyPaths()"><span class="material-symbols-outlined">link</span>Copy folder path</button>
                <template x-if="!fb.isRemote">
                  <button type="button" @click="fb.reveal({ path: fb.path }); fb.menu = null"><span class="material-symbols-outlined">folder_eye</span>Open in File Explorer</button>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- Confirmation -->
        <template x-if="fb.confirm">
          <div class="fb-overlay" @click.self="fb.cancelConfirm()" @keydown.escape.stop="fb.cancelConfirm()">
            <div class="fb-dialog" role="alertdialog" x-init="$nextTick(() => $el.querySelector('.btn-ok')?.focus())">
              <div class="fb-dialog-title" x-text="fb.confirm.title"></div>
              <p x-text="fb.confirm.message"></p>
              <div class="fb-dialog-actions">
                <button type="button" class="btn btn-cancel" @click="fb.cancelConfirm()">Cancel</button>
                <button type="button" class="btn btn-ok" :class="{ 'fb-danger': fb.confirm.danger }" @click="fb.confirmOk()" x-text="fb.confirm.okLabel"></button>
              </div>
            </div>
          </div>
        </template>

        <!-- Built-in text editor -->
        <template x-if="fb.textEditor">
          <div class="fb-overlay fb-editor">
            <div class="fb-editor-bar">
              <span class="material-symbols-outlined">edit_note</span>
              <span class="fb-editor-name" x-text="fb.textEditor.name + (fb.textEditorDirty ? ' •' : '')" :title="fb.textEditor.path"></span>
              <span class="fb-editor-enc" x-text="fb.textEditor.encoding.toUpperCase()"></span>
              <span class="fb-grow"></span>
              <span class="fb-editor-error" x-show="fb.textEditor.error" x-text="fb.textEditor.error"></span>
              <button type="button" class="btn btn-ok" :disabled="!fb.textEditorDirty || fb.textEditor.saving" @click="fb.saveText()"
                      x-text="fb.textEditor.saving ? 'Saving...' : 'Save (Ctrl+S)'"></button>
              <button type="button" class="btn btn-cancel" @click="fb.closeTextEditor()">Close</button>
            </div>
            <textarea class="fb-editor-text" spellcheck="false" x-model="fb.textEditor.content"
                      x-init="$nextTick(() => $el.focus())" @keydown.tab.prevent="document.execCommand('insertText', false, '    ')"></textarea>
          </div>
        </template>
      </div>
    </template>

    <!-- Footer: picker actions (Editor Open / Save As) and Close -->
    <template x-if="$store.fileBrowser">
      <div class="modal-footer file-browser-footer" data-modal-footer :class="{ 'is-surface': xAttrs($el)?.mode === 'canvas' }"
           x-show="$store.fileBrowser.isPickerMode() || xAttrs($el)?.mode !== 'canvas'">
        <template x-if="$store.fileBrowser.isPickerMode()">
          <div class="fb-picker">
            <template x-if="$store.fileBrowser.isSaveAsPicker()">
              <input type="text" class="fb-picker-name" x-model="$store.fileBrowser.pickerFilename" placeholder="File name" aria-label="File name"
                     spellcheck="false" @input="$store.fileBrowser.pickerFilenameError = ''" @keydown.enter.prevent="$store.fileBrowser.confirmPicker()" />
            </template>
            <span class="fb-picker-label" x-show="$store.fileBrowser.isTextOpenPicker()" x-text="$store.fileBrowser.pickerSelectionLabel()"></span>
            <span class="fb-picker-error" x-show="$store.fileBrowser.pickerFilenameError" x-text="$store.fileBrowser.pickerFilenameError"></span>
            <button type="button" class="btn btn-ok" :disabled="!$store.fileBrowser.canConfirmPicker() || $store.fileBrowser.isBulkBusy"
                    @click="$store.fileBrowser.confirmPicker()" x-text="$store.fileBrowser.pickerConfirmLabel"></button>
            <button type="button" class="btn btn-cancel" @click="$store.fileBrowser.cancelPicker()">Cancel</button>
          </div>
        </template>
        <template x-if="!$store.fileBrowser.isPickerMode()">
          <button type="button" class="btn btn-cancel" @click="$store.fileBrowser.handleClose()">Close</button>
        </template>
      </div>
    </template>
  </div>

  <style>
    .file-browser-shell { width: 100%; min-width: 0; }
    .modal-inner.file-browser-modal {
      box-sizing: border-box; width: min(86vw, 1180px); height: min(84vh, 860px);
      min-width: min(420px, calc(100vw - 16px)); min-height: min(360px, calc(100vh - 16px));
      max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); resize: both; overflow: hidden;
    }
    .modal-inner.file-browser-modal.is-focus-mode { resize: none; border-radius: 6px; }
    .modal-inner.file-browser-modal .modal-header {
      min-height: 34px; padding: 0.35rem 0.75rem 0.35rem 1rem;
      background: color-mix(in srgb, var(--color-background) 92%, #000 8%);
      border-bottom: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
    }
    .modal-inner.file-browser-modal .modal-scroll,
    .modal-inner.file-browser-modal .modal-bd.file-browser-modal-body {
      display: flex; flex: 1 1 auto; width: 100%; height: 100%; min-width: 0; min-height: 0; max-height: none; overflow: hidden; padding: 0;
    }
    .modal-inner.file-browser-modal .modal-bd.file-browser-modal-body > div[x-data],
    .modal-inner.file-browser-modal .file-browser-shell,
    .file-browser-shell.is-surface { display: flex; flex: 1 1 auto; flex-direction: column; height: 100%; min-width: 0; min-height: 0; }
    .file-browser-footer { padding: 0.45rem 0.75rem; gap: 8px; }

    .fb {
      --fb-line: color-mix(in srgb, var(--color-border) 75%, transparent);
      --fb-hover: var(--color-background-hover, color-mix(in srgb, var(--color-text) 7%, transparent));
      --fb-sel: color-mix(in srgb, var(--color-primary) 22%, transparent);
      --fb-sel-line: color-mix(in srgb, var(--color-primary) 55%, transparent);
      position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; height: 100%;
      font-size: 0.86rem; color: var(--color-text); outline: none; user-select: none;
    }
    .fb .material-symbols-outlined { font-size: 19px; line-height: 1; }
    .fb-grow { flex: 1 1 auto; }

    .fb-navbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--fb-line); }
    .fb-icon-btn, .fb-cmd {
      display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid transparent;
      border-radius: 6px; background: transparent; color: inherit; cursor: pointer; font: inherit; white-space: nowrap;
    }
    .fb-icon-btn { width: 30px; padding: 0; justify-content: center; }
    .fb-icon-btn:hover:not(:disabled), .fb-cmd:hover:not(:disabled):not(.is-disabled) { background: var(--fb-hover); }
    .fb-icon-btn:disabled, .fb-cmd:disabled, .fb-cmd.is-disabled { opacity: 0.38; cursor: default; }
    .fb-cmd.is-on { background: var(--fb-sel); border-color: var(--fb-sel-line); }
    .fb-spin { animation: fb-spin 0.9s linear infinite; }
    @keyframes fb-spin { to { transform: rotate(360deg); } }

    .fb-address {
      flex: 1 1 auto; min-width: 0; height: 30px; display: flex; align-items: center; padding: 0 6px; margin-left: 4px;
      border: 1px solid var(--fb-line); border-radius: 6px; background: var(--color-input, transparent); cursor: text;
    }
    .fb-crumbs { display: flex; align-items: center; min-width: 0; overflow: hidden; width: 100%; height: 100%; }
    .fb-crumb-icon { opacity: 0.7; margin-right: 2px; }
    .fb-crumb { display: inline-flex; align-items: center; min-width: 0; flex-shrink: 1; overflow: hidden; }
    .fb-crumb:last-child { flex-shrink: 0; }
    .fb-crumb button {
      border: 0; background: transparent; color: inherit; font: inherit; padding: 3px 5px; border-radius: 4px; cursor: pointer;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px;
    }
    .fb-crumb button:hover:not(:disabled) { background: var(--fb-hover); }
    .fb-crumb button:disabled { opacity: 0.55; cursor: default; }
    .fb-crumb-sep { font-size: 16px !important; opacity: 0.5; }
    .fb-address-input { width: 100%; height: 100%; border: 0; outline: none; background: transparent; color: inherit; font: inherit; }
    .fb-search {
      display: flex; align-items: center; gap: 4px; width: 210px; height: 30px; padding: 0 8px; border: 1px solid var(--fb-line);
      border-radius: 6px; background: var(--color-input, transparent);
    }
    .fb-search .material-symbols-outlined { opacity: 0.6; font-size: 17px; }
    .fb-search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: inherit; font: inherit; }

    .fb-commands { display: flex; align-items: center; gap: 2px; padding: 4px 8px; border-bottom: 1px solid var(--fb-line); overflow-x: auto; }
    .fb-cmd-icon { width: 32px; padding: 0; justify-content: center; }
    .fb-cmd-sep { width: 1px; height: 20px; margin: 0 4px; background: var(--fb-line); }

    .fb-body { display: flex; flex: 1 1 auto; min-height: 0; }
    .fb-nav {
      width: 220px; flex: 0 0 auto; overflow-y: auto; padding: 6px 4px; border-right: 1px solid var(--fb-line);
      background: color-mix(in srgb, var(--color-panel, var(--color-background)) 60%, transparent);
    }
    .fb-nav-title { padding: 8px 8px 4px; font-size: 0.74rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.6; }
    .fb-nav-item {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px;
      background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .fb-nav-item:hover:not(:disabled) { background: var(--fb-hover); }
    .fb-nav-item.is-current { background: var(--fb-sel); }
    .fb-nav-item > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fb-drive { align-items: flex-start; }
    .fb-drive.is-locked { opacity: 0.45; cursor: not-allowed; }
    .fb-drive-text { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .fb-drive-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fb-drive-bar { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--color-text) 14%, transparent); overflow: hidden; }
    .fb-drive-bar > span { display: block; height: 100%; background: var(--color-primary); }
    .fb-drive-bar > span.is-full { background: var(--color-error, #ef4444); }
    .fb-drive-free { font-size: 0.72rem; opacity: 0.6; }
    .fb-lock { font-size: 15px !important; opacity: 0.7; margin-top: 2px; }
    .fb-nav-note { display: flex; gap: 6px; align-items: flex-start; margin: 10px 6px; font-size: 0.74rem; opacity: 0.65; }

    .fb-main { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; overflow: hidden; container: fb-list / inline-size; }
    .fb-header, .fb-row { display: grid; grid-template-columns: minmax(180px, 1fr) 150px 120px 90px; align-items: center; }
    .fb-header { border-bottom: 1px solid var(--fb-line); padding: 0 8px; }
    .fb-header button {
      display: flex; align-items: center; gap: 2px; height: 28px; padding: 0 6px; border: 0; border-radius: 4px;
      background: transparent; color: inherit; font: inherit; font-size: 0.78rem; opacity: 0.75; cursor: pointer; text-align: left;
    }
    .fb-header button:hover { background: var(--fb-hover); opacity: 1; }
    .fb-header .material-symbols-outlined { font-size: 14px !important; }
    .fb-header .fb-col-size { justify-content: flex-end; }
    .fb-rows { flex: 1 1 auto; overflow-y: auto; padding: 2px 8px 8px; }
    .fb-row { height: 30px; border: 1px solid transparent; border-radius: 5px; cursor: default; }
    .fb-row:hover { background: var(--fb-hover); }
    .fb-row.is-selected { background: var(--fb-sel); border-color: var(--fb-sel-line); }
    .fb-row.is-hidden, .fb-row.is-cut { opacity: 0.55; }
    .fb-row > span { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fb-row .fb-col-modified, .fb-row .fb-col-type, .fb-row .fb-col-size { font-size: 0.8rem; opacity: 0.72; }
    .fb-row .fb-col-size { text-align: right; }
    .fb-name { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .fb-file-icon { opacity: 0.78; }
    .fb-file-icon.is-folder { color: #e8b84a; opacity: 1; font-variation-settings: "FILL" 1; }
    .fb-name-text { overflow: hidden; text-overflow: ellipsis; }
    .fb-badge { font-size: 14px !important; opacity: 0.55; }
    .fb-surface-btn {
      display: none; margin-left: auto; height: 22px; width: 26px; align-items: center; justify-content: center;
      border: 0; border-radius: 4px; background: transparent; color: inherit; cursor: pointer;
    }
    .fb-row:hover .fb-surface-btn, .fb-row.is-selected .fb-surface-btn { display: inline-flex; }
    .fb-surface-btn:hover { background: var(--fb-hover); }
    .fb-empty { padding: 40px 12px; text-align: center; opacity: 0.6; }
    .fb-drop {
      position: absolute; inset: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      border: 2px dashed var(--color-primary); border-radius: 10px; pointer-events: none;
      background: color-mix(in srgb, var(--color-primary) 10%, var(--color-background));
    }
    .fb-drop .material-symbols-outlined { font-size: 40px !important; color: var(--color-primary); }

    .fb-preview { width: 280px; flex: 0 0 auto; overflow-y: auto; padding: 12px; border-left: 1px solid var(--fb-line); }
    .fb-preview-empty { padding: 30px 6px; text-align: center; opacity: 0.55; }
    .fb-preview-content { display: flex; flex-direction: column; gap: 12px; user-select: text; }
    .fb-preview-image { max-width: 100%; max-height: 260px; object-fit: contain; border-radius: 6px; background: repeating-conic-gradient(#8882 0% 25%, transparent 0% 50%) 50% / 16px 16px; }
    .fb-preview-frame { width: 100%; height: 340px; border: 1px solid var(--fb-line); border-radius: 6px; background: #fff; }
    .fb-preview-text { max-height: 340px; overflow: auto; margin: 0; padding: 8px; font-size: 0.74rem; white-space: pre-wrap; word-break: break-word;
      border-radius: 6px; background: var(--color-input, color-mix(in srgb, var(--color-text) 6%, transparent)); }
    .fb-preview-icon { display: flex; justify-content: center; padding: 20px 0; }
    .fb-preview-icon .material-symbols-outlined { font-size: 72px !important; opacity: 0.6; }
    .fb-props { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: 0.8rem; }
    .fb-props dt { opacity: 0.6; }
    .fb-props dd { margin: 0; overflow-wrap: anywhere; }

    .fb-status {
      display: flex; align-items: center; gap: 12px; min-height: 26px; padding: 0 10px; font-size: 0.76rem; opacity: 0.85;
      border-top: 1px solid var(--fb-line); white-space: pre;
    }
    .fb-status-flag { display: inline-flex; align-items: center; gap: 3px; }
    .fb-status-flag .material-symbols-outlined { font-size: 14px !important; }
    .fb-upload { display: inline-flex; align-items: center; gap: 6px; }
    .fb-upload-bar { width: 90px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--color-text) 14%, transparent); overflow: hidden; }
    .fb-upload-bar > span { display: block; height: 100%; background: var(--color-primary); transition: width 0.2s; }

    .fb-menu {
      position: absolute; z-index: 60; min-width: 230px; padding: 4px; border: 1px solid var(--fb-line); border-radius: 8px;
      background: var(--color-panel, var(--color-background)); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .fb-menu button {
      display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 10px; border: 0; border-radius: 5px;
      background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .fb-menu button:hover:not(:disabled) { background: var(--fb-hover); }
    .fb-menu button:disabled { opacity: 0.4; cursor: default; }
    .fb-menu kbd { margin-left: auto; padding-left: 16px; font-family: inherit; font-size: 0.72rem; opacity: 0.55; background: none; border: 0; }
    .fb-menu hr { margin: 4px 6px; border: 0; border-top: 1px solid var(--fb-line); }

    .fb-overlay {
      position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--color-background) 55%, transparent); backdrop-filter: blur(2px);
    }
    .fb-dialog {
      width: min(420px, calc(100% - 32px)); padding: 18px; border: 1px solid var(--fb-line); border-radius: 10px;
      background: var(--color-panel, var(--color-background)); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    .fb-dialog-title { font-weight: 600; font-size: 1rem; margin-bottom: 8px; }
    .fb-dialog p { margin: 0 0 16px; line-height: 1.45; user-select: text; }
    .fb-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .fb-danger { background: var(--color-error, #ef4444) !important; border-color: var(--color-error, #ef4444) !important; color: #fff !important; }

    .fb-editor { flex-direction: column; align-items: stretch; justify-content: flex-start; background: var(--color-background); backdrop-filter: none; }
    .fb-editor-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--fb-line); }
    .fb-editor-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fb-editor-enc { font-size: 0.7rem; opacity: 0.55; }
    .fb-editor-error { color: var(--color-error, #ef4444); font-size: 0.8rem; }
    .fb-editor-text {
      flex: 1 1 auto; width: 100%; resize: none; border: 0; outline: none; padding: 12px; margin: 0;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.84rem; line-height: 1.5; tab-size: 4;
      background: transparent; color: inherit; white-space: pre; overflow: auto;
    }

    .fb-picker { display: flex; align-items: center; gap: 8px; width: 100%; }
    .fb-picker-name {
      flex: 1 1 auto; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--color-border); border-radius: 6px;
      background: var(--color-input, transparent); color: inherit; font: inherit;
    }
    .fb-picker-label { flex: 1 1 auto; opacity: 0.75; font-size: 0.85rem; }
    .fb-picker-error { color: var(--color-error, #ef4444); font-size: 0.8rem; }

    /* The list drops columns as it narrows (Type, then Date); the window drops panes. */
    @container fb-list (max-width: 620px) {
      .fb-header, .fb-row { grid-template-columns: minmax(150px, 1fr) 140px 80px; }
      .fb-header .fb-col-type, .fb-row .fb-col-type { display: none; }
    }
    @container fb-list (max-width: 440px) {
      .fb-header, .fb-row { grid-template-columns: minmax(120px, 1fr) 76px; }
      .fb-header .fb-col-modified, .fb-row .fb-col-modified { display: none; }
    }
    .fb { container: fb-root / inline-size; }
    @container fb-root (max-width: 760px) { .fb-preview { display: none; } }
    @container fb-root (max-width: 700px) {
      .fb-nav { width: 180px; }
      .fb-cmd > span:not(.material-symbols-outlined) { display: none; }
      .fb-cmd { width: 32px; padding: 0; justify-content: center; }
    }
    @container fb-root (max-width: 520px) {
      .fb-nav { position: absolute; z-index: 20; top: 0; bottom: 0; left: 0; box-shadow: 4px 0 18px rgba(0, 0, 0, 0.3); background: var(--color-panel, var(--color-background)); }
      .fb-search { width: 120px; }
      .fb-crumb:not(:nth-last-child(-n + 2)) { display: none; }
      .fb-crumb:nth-last-child(2) .fb-crumb-sep { display: none; }
      .fb-crumb-icon { display: none; }
      .fb-navbar .fb-icon-btn:nth-child(2) { display: none; }
    }
  </style>
</body>
</html>
