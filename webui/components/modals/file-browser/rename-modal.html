<html>
<head>
  <title>Rename</title>
  <script type="module">
    import { store } from "/components/modals/file-browser/file-browser-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.fileBrowser">
      <div class="rename-modal-root" x-destroy="$store.fileBrowser.focusList()" x-init="$nextTick(() => { const el = $refs.renameInput; if (!el) return; el.focus(); const dot = el.value.lastIndexOf('.'); el.setSelectionRange(0, dot > 0 && $store.fileBrowser.renameMode !== 'create-folder' ? dot : el.value.length) })">
        <div class="rename-form">
          <label class="rename-label" x-text="$store.fileBrowser.renameTitle"></label>
          <input
            class="rename-input"
            type="text"
            x-ref="renameInput"
            x-model="$store.fileBrowser.renameName"
            @keydown.enter.prevent="$store.fileBrowser.confirmRename()"
            :disabled="$store.fileBrowser.isRenaming"
          />
          <template x-if="$store.fileBrowser.renameError">
            <p class="rename-error" x-text="$store.fileBrowser.renameError"></p>
          </template>
          <p class="rename-hint" x-text="$store.fileBrowser.renameMode === 'rename' ? 'The item stays in the same folder.' : 'It will be created in the current folder.'"></p>
        </div>
      </div>
    </template>
  </div>

  <template x-if="$store.fileBrowser">
    <div class="modal-footer" data-modal-footer>
      <button class="btn btn-ok" @click="$store.fileBrowser.confirmRename()" :disabled="$store.fileBrowser.isRenaming || !$store.fileBrowser.renameName.trim()" x-text="({ 'create-folder': 'Create Folder', 'create-file': 'Create File' })[$store.fileBrowser.renameMode] || 'Rename'"></button>
      <button class="btn btn-cancel" @click="$store.fileBrowser.closeRenameModal()" :disabled="$store.fileBrowser.isRenaming">Cancel</button>
    </div>
  </template>

  <style>
    .rename-modal-root {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      width: 100%;
    }

    .rename-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      margin: 1rem;
    }

    .rename-label {
      font-weight: 600;
      color: var(--color-text);
    }

    .rename-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-background);
      color: var(--color-text);
    }

    .rename-input:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .rename-hint {
      margin: 0;
      color: var(--color-text-secondary);
      font-size: 0.85rem;
    }

    .rename-error {
      margin: 0;
      color: var(--color-accent);
      font-weight: 500;
      font-size: 0.85rem;
    }
  </style>
</body>
</html>
